name: pdf_reader_app
description: "A new Flutter project for reading PDFs with 3D page flip effect."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  pdfx: ^2.6.0
  path_provider: ^2.1.2
  http: ^1.2.0
  page_flip: ^0.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
