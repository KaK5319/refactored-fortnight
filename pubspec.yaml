name: pdf_reader_app
description: "A new Flutter project with vertical cylinder page curl effect."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # PDF表示用
  pdfx: ^2.6.0

  # PDFファイルのダウンロードおよびパス取得用
  http: ^1.2.0
  path_provider: ^2.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
